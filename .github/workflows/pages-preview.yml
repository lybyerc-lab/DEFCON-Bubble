name: GitHub Pages Preview

on:
  push:
    branches:
      - main
      - agent/pop-proof
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: defcon-bubble-pages
  cancel-in-progress: true

jobs:
  build-and-verify:
    name: Build and verify Web preview
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read

    steps:
      # [DB:PLATFORM:WEB_PREVIEW]
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build pinned Godot Web export
        shell: bash
        run: bash scripts/build_web.sh

      - name: Verify exact preview candidate
        shell: bash
        run: |
          set -euo pipefail
          godot_bin=".godot-web/Godot_v4.7.1-stable_linux.x86_64"
          "${godot_bin}" --headless --path . --script res://tests/foundation_smoke.gd
          "${godot_bin}" --headless --path . --script res://tests/damage_contract_smoke.gd
          "${godot_bin}" --headless --path . --script res://tests/pop_proof_smoke.gd
          "${godot_bin}" --headless --path . --quit-after 3
          test -f build/web/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: build/web

  deploy:
    name: Deploy exact-source phone preview
    needs: build-and-verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
      statuses: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

      - name: Record exact-source preview status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          payload="$(jq -n \
            --arg state "success" \
            --arg target_url "${PAGE_URL}" \
            --arg description "Exact-source DEFCON BUBBLE phone preview" \
            --arg context "pages-preview" \
            '{state:$state,target_url:$target_url,description:$description,context:$context}')"
          curl -fsSL \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "${payload}"
