name: Godot Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  godot-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GODOT_VERSION: 4.7.1-stable
      GODOT_ZIP: Godot_v4.7.1-stable_linux.x86_64.zip

    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download pinned Godot editor
        shell: bash
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}"
          curl -fL --retry 3 -o "${GODOT_ZIP}" "${base}/${GODOT_ZIP}"
          curl -fL --retry 3 -o SHA512-SUMS.txt "${base}/SHA512-SUMS.txt"
          grep " ${GODOT_ZIP}$" SHA512-SUMS.txt | sha512sum -c -
          unzip -q "${GODOT_ZIP}" -d .godot-ci
          chmod +x ".godot-ci/Godot_v4.7.1-stable_linux.x86_64"

      - name: Verify engine pin
        run: .godot-ci/Godot_v4.7.1-stable_linux.x86_64 --version

      - name: Import project
        run: .godot-ci/Godot_v4.7.1-stable_linux.x86_64 --headless --path . --import

      - name: Run foundation contract smoke test
        run: .godot-ci/Godot_v4.7.1-stable_linux.x86_64 --headless --path . --script res://tests/foundation_smoke.gd

      - name: Run damage contract smoke test
        run: .godot-ci/Godot_v4.7.1-stable_linux.x86_64 --headless --path . --script res://tests/damage_contract_smoke.gd

      - name: Run first POP proof
        run: .godot-ci/Godot_v4.7.1-stable_linux.x86_64 --headless --path . --script res://tests/pop_proof_smoke.gd

      - name: Run first castle impact proof
        run: .godot-ci/Godot_v4.7.1-stable_linux.x86_64 --headless --path . --script res://tests/castle_impact_smoke.gd

      - name: Run first defensive wave proof
        run: .godot-ci/Godot_v4.7.1-stable_linux.x86_64 --headless --path . --script res://tests/first_defense_smoke.gd

      - name: Run Fast Bubble proof
        run: .godot-ci/Godot_v4.7.1-stable_linux.x86_64 --headless --path . --script res://tests/fast_bubble_smoke.gd

      - name: Run bipedal Bubble Creature proof
        run: .godot-ci/Godot_v4.7.1-stable_linux.x86_64 --headless --path . --script res://tests/bubble_creature_smoke.gd

      - name: Run Big Blub proof
        run: .godot-ci/Godot_v4.7.1-stable_linux.x86_64 --headless --path . --script res://tests/heavy_bubble_smoke.gd

      - name: Run beach environment structure proof
        run: .godot-ci/Godot_v4.7.1-stable_linux.x86_64 --headless --path . --script res://tests/environment_structure_smoke.gd

      - name: Run mixed three-wave encounter proof
        run: .godot-ci/Godot_v4.7.1-stable_linux.x86_64 --headless --path . --script res://tests/mixed_encounter_smoke.gd

      - name: Run first upgrade choice proof
        run: .godot-ci/Godot_v4.7.1-stable_linux.x86_64 --headless --path . --script res://tests/first_upgrade_choice_smoke.gd

      - name: Boot main scene headlessly
        run: .godot-ci/Godot_v4.7.1-stable_linux.x86_64 --headless --path . --quit-after 3
